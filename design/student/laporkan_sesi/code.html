<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .ambient-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 93, 167, 0.08);
        }
        /* Custom radio button styling */
        input[type="radio"]:checked + div {
            border-color: #005da7;
            background-color: #f8f9fa;
        }
        input[type="radio"]:checked + div .radio-inner {
            background-color: #005da7;
            transform: scale(1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-lg mx-auto">
<!-- Form View -->
<div class="bg-surface-container-lowest rounded-xl border border-surface-variant p-md ambient-shadow glass-card transition-all duration-300" id="reportForm">
<header class="flex items-start justify-between mb-lg">
<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface mb-xs">Laporkan Sesi</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Laporanmu akan ditinjau oleh pihak sekolah secara rahasia.</p>
</div>
<button aria-label="Tutup" class="text-on-surface-variant hover:text-on-surface p-2 rounded-full hover:bg-surface-container transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</header>
<form onsubmit="event.preventDefault(); showConfirmation();">
<fieldset class="mb-lg">
<legend class="sr-only">Alasan Pelaporan</legend>
<p class="font-label-md text-label-md text-on-surface mb-sm">Pilih alasan laporan (wajib)</p>
<div class="space-y-sm">
<!-- Reason 1 -->
<label class="cursor-pointer flex items-center group relative block">
<input class="peer sr-only" name="reason" required="" type="radio" value="uncomfortable"/>
<div class="w-full flex items-center gap-sm p-sm rounded-lg border border-outline-variant group-hover:border-primary/50 transition-colors bg-surface-container-lowest">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center shrink-0">
<div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Saya merasa tidak nyaman</span>
</div>
</label>
<!-- Reason 2 -->
<label class="cursor-pointer flex items-center group relative block">
<input class="peer sr-only" name="reason" type="radio" value="unresponsive"/>
<div class="w-full flex items-center gap-sm p-sm rounded-lg border border-outline-variant group-hover:border-primary/50 transition-colors bg-surface-container-lowest">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center shrink-0">
<div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Kader tidak merespons</span>
</div>
</label>
<!-- Reason 3 -->
<label class="cursor-pointer flex items-center group relative block">
<input class="peer sr-only" name="reason" type="radio" value="need_teacher"/>
<div class="w-full flex items-center gap-sm p-sm rounded-lg border border-outline-variant group-hover:border-primary/50 transition-colors bg-surface-container-lowest">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center shrink-0">
<div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Saya ingin bantuan guru/BK</span>
</div>
</label>
<!-- Reason 4 -->
<label class="cursor-pointer flex items-center group relative block">
<input class="peer sr-only" name="reason" type="radio" value="other"/>
<div class="w-full flex flex-col gap-sm p-sm rounded-lg border border-outline-variant group-hover:border-primary/50 transition-colors bg-surface-container-lowest">
<div class="flex items-center gap-sm">
<div class="w-5 h-5 rounded-full border-2 border-outline-variant peer-checked:border-primary flex items-center justify-center shrink-0">
<div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transform scale-0 transition-transform duration-200"></div>
</div>
<span class="font-body-md text-body-md text-on-surface">Lainnya</span>
</div>
<!-- Reveal textarea on check (requires minimal JS or CSS peer trick, using simple class toggle here would be better but keeping simple HTML/CSS) -->
</div>
</label>
</div>
</fieldset>
<div class="flex gap-sm justify-end mt-xl">
<button class="px-md py-sm rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">
                        Batal
                    </button>
<button class="px-md py-sm rounded-lg bg-primary text-on-primary font-label-md text-label-md hover:bg-primary/90 transition-colors shadow-sm" type="submit">
                        Kirim Laporan
                    </button>
</div>
</form>
</div>
<!-- Success Confirmation View (Hidden initially) -->
<div class="hidden bg-surface-container-lowest rounded-xl border border-surface-variant p-lg ambient-shadow glass-card text-center transition-all duration-300" id="successView">
<!-- Soft Monochromatic Illustration Placeholder (Empty State style) -->
<div class="mx-auto w-32 h-32 mb-md bg-secondary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">Laporan Terkirim</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
                Terima kasih sudah memberi tahu kami. Laporanmu akan ditinjau oleh pihak sekolah.
            </p>
<button class="w-full px-md py-sm rounded-lg bg-surface-container text-on-surface font-label-md text-label-md hover:bg-surface-container-high transition-colors" onclick="closeModal()" type="button">
                Tutup
            </button>
</div>
</main>
<script>
        function showConfirmation() {
            document.getElementById('reportForm').classList.add('hidden');
            document.getElementById('successView').classList.remove('hidden');
        }

        function closeModal() {
            // In a real app, this would close the modal or redirect.
            alert('Modal closed/Redirecting back to dashboard.');
        }
    </script>
</body></html>
